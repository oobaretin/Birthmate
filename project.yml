name: Birthmate
options:
  bundleIdPrefix: com.birthmate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Birthmate:
    type: application
    platform: iOS
    sources:
      - path: Birthmate
      - path: BirthmateShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.birthmate.app
        INFOPLIST_FILE: Birthmate/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Birthmate
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Birthmate sends a daily reminder to explore your birthday feed."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Birthmate/Birthmate.entitlements
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: BirthmateWidgetExtension
        embed: true

  BirthmateWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BirthmateWidget
      - path: BirthmateShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.birthmate.app.widget
        INFOPLIST_FILE: BirthmateWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birthmate Widget
        CODE_SIGN_ENTITLEMENTS: BirthmateWidget/BirthmateWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
    dependencies: []

  BirthmateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BirthmateTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Birthmate
